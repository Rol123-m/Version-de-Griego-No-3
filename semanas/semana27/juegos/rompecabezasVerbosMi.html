<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rompecabezas Verbos -μι | Semana 27</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Segoe UI', 'Poppins', Arial, sans-serif; background: linear-gradient(145deg, #0a1628, #1a2a4a, #0d1f3c); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 15px 60px; color: white; }
    .logo { width: 160px; max-width: 60%; margin: 10px auto 5px; filter: drop-shadow(0 4px 20px rgba(255, 215, 0, 0.2)); border-radius: 12px; }
    h1 { text-align: center; font-size: clamp(1.3rem, 4.5vw, 2.2rem); margin-bottom: 8px; color: #FFD700; font-weight: 700; }
    h1 span { background: linear-gradient(135deg, #FFD700, #FFA500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { text-align: center; font-size: clamp(0.8rem, 2vw, 1rem); color: rgba(255, 255, 255, 0.5); margin-bottom: 15px; letter-spacing: 2px; }
    #progress { font-size: clamp(0.85rem, 2.2vw, 1.1rem); margin: 5px 0 15px; padding: 10px 25px; background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(10px); border-radius: 50px; border: 1px solid rgba(255, 215, 0, 0.15); display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    #progress .stat span { color: #FFD700; font-weight: 700; }
    .game-container { width: 100%; max-width: 700px; }
    .question-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border-radius: 24px; padding: clamp(20px, 4vw, 40px); border: 1px solid rgba(255, 215, 0, 0.1); margin-bottom: 20px; text-align: center; }
    .question-label { font-size: clamp(0.7rem, 1.5vw, 0.85rem); color: rgba(255, 215, 0, 0.5); text-transform: uppercase; letter-spacing: 3px; font-weight: 600; margin-bottom: 5px; }
    .translation { font-size: clamp(1.2rem, 3vw, 1.6rem); color: #FFD700; font-weight: 700; margin: 15px 0; }
    .pieces-container { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(8px, 1.5vw, 14px); margin: 20px 0; min-height: 70px; }
    .piece { padding: clamp(12px, 2vw, 18px) clamp(16px, 2.5vw, 24px); background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 215, 0, 0.3); border-radius: 12px; cursor: pointer; font-size: clamp(1.1rem, 2.5vw, 1.4rem); font-family: 'Times New Roman', 'New Athena Unicode', serif; font-weight: 700; color: #fff; transition: all 0.25s; min-height: 55px; display: flex; align-items: center; justify-content: center; }
    .piece:hover:not(.used) { transform: translateY(-3px); border-color: #FFD700; background: rgba(255, 215, 0, 0.15); }
    .piece.used { opacity: 0.15; cursor: not-allowed; transform: scale(0.9); filter: grayscale(0.8); pointer-events: none; }
    .assembly-area { min-height: 80px; margin: 20px 0; padding: clamp(12px, 2vw, 20px); background: rgba(255, 255, 255, 0.03); border: 2px dashed rgba(255, 215, 0, 0.3); border-radius: 12px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
    .assembly-area .placeholder { color: rgba(255, 255, 255, 0.3); font-style: italic; font-size: clamp(0.85rem, 2vw, 1rem); }
    .assembled-piece { padding: clamp(10px, 1.8vw, 16px) clamp(14px, 2.2vw, 22px); background: rgba(46, 204, 113, 0.15); border: 2px solid #2ecc71; border-radius: 10px; font-size: clamp(1rem, 2.2vw, 1.3rem); font-family: 'Times New Roman', 'New Athena Unicode', serif; font-weight: 700; color: #2ecc71; cursor: pointer; transition: all 0.2s; }
    .assembled-piece:hover { background: rgba(231, 76, 60, 0.2); border-color: #e74c3c; color: #e74c3c; transform: scale(0.95); }
    .assembled-piece::after { content: ' ✕'; font-size: 0.7em; opacity: 0.5; }
    .feedback { margin-top: 15px; padding: clamp(12px, 2vw, 18px); border-radius: 12px; font-size: clamp(0.95rem, 2vw, 1.1rem); text-align: center; min-height: 50px; display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(10px); transition: all 0.4s ease; }
    .feedback.show { opacity: 1; transform: translateY(0); }
    .feedback.success { background: rgba(46, 204, 113, 0.15); border: 1px solid rgba(46, 204, 113, 0.3); color: #2ecc71; }
    .feedback.error { background: rgba(231, 76, 60, 0.15); border: 1px solid rgba(231, 76, 60, 0.3); color: #e74c3c; }
    .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 15px; }
    .ctrl-btn { padding: clamp(12px, 2vw, 16px) clamp(20px, 4vw, 32px); border: none; border-radius: 50px; font-size: clamp(0.9rem, 2vw, 1.05rem); font-weight: 700; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
    .ctrl-btn.primary { background: linear-gradient(135deg, #FFD700, #FFA500); color: #1a1a2e; }
    .ctrl-btn.secondary { background: rgba(255, 255, 255, 0.1); color: white; border: 2px solid rgba(255, 255, 255, 0.2); }
    .ctrl-btn:hover:not(:disabled) { transform: translateY(-2px); }
    .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .final-message { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); background: linear-gradient(145deg, #0f1a2e, #1a2a4a); padding: clamp(30px, 5vw, 50px); border-radius: 30px; text-align: center; animation: zoomIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; border: 2px solid rgba(255, 215, 0, 0.3); z-index: 1000; max-width: 90vw; width: 450px; }
    @keyframes zoomIn { 0% { transform: translate(-50%, -50%) scale(0) rotate(-3deg); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; } }
    .final-message img { width: clamp(120px, 25vw, 170px); margin-bottom: 15px; border-radius: 15px; }
    .final-message h2 { color: #FFD700; font-size: clamp(1.5rem, 4vw, 2.2rem); margin-bottom: 10px; }
    .final-message .stats { font-size: clamp(1rem, 2vw, 1.2rem); opacity: 0.9; line-height: 1.8; }
    .final-message .stats span { color: #FFD700; font-weight: 700; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
    .overlay.active { opacity: 1; pointer-events: all; }
    @media (max-width: 480px) {
      .logo { width: 110px; }
      h1 { font-size: 1.1rem; }
      .piece { padding: 10px 14px; font-size: 1rem; }
      .assembled-piece { padding: 8px 12px; font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <img src="https://i.postimg.cc/wMJ2bCgV/mas-logos.jpg" class="logo" alt="Logo">
  <h1>🧩 <span>Rompecabezas Verbos -μι</span></h1>
  <div class="subtitle">✧ Semana 27: Formas Verbales Atemáticas ✧</div>

  <div id="progress">
    <div class="stat">🧩 Puzzle <span id="current-q">1</span>/<span id="total-q">12</span></div>
    <div class="stat">✅ Aciertos: <span id="correct-count">0</span></div>
  </div>

  <div class="game-container">
    <div class="question-card" id="questionCard">
      <div class="question-label">ARMA LA FORMA VERBAL</div>
      <div class="translation" id="translation"></div>
      <div class="pieces-container" id="piecesContainer"></div>
      <div class="assembly-area" id="assemblyArea">
        <div class="placeholder">Toca las piezas para armar la forma verbal</div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="controls">
        <button class="ctrl-btn secondary" id="resetBtn">↺ Reiniciar</button>
        <button class="ctrl-btn primary" id="checkBtn">✓ Verificar</button>
        <button class="ctrl-btn primary" id="nextBtn" disabled>Siguiente →</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>

  <script>
    const exercises = [
      {parts:["δί","δω","μι"], answer:"δίδωμι", translation:"doy (presente 1sg)"},
      {parts:["δί","δως"], answer:"δίδως", translation:"das (presente 2sg)"},
      {parts:["δί","δω","σι"], answer:"δίδωσι", translation:"da (presente 3sg)"},
      {parts:["δί","δο","μεν"], answer:"δίδομεν", translation:"damos (presente 1pl)"},
      {parts:["δι","δό","ασι"], answer:"διδόασι", translation:"dan (presente 3pl)"},
      {parts:["δώ","σω"], answer:"δώσω", translation:"daré (futuro 1sg)"},
      {parts:["ἔ","δω","κα"], answer:"ἔδωκα", translation:"di (aoristo 1sg)"},
      {parts:["δέ","δω","κα"], answer:"δέδωκα", translation:"he dado (perfecto 1sg)"},
      {parts:["ἐ","δί","δουν"], answer:"ἐδίδουν", translation:"daba (imperfecto 1sg)"},
      {parts:["τί","θη","μι"], answer:"τίθημι", translation:"pongo (presente 1sg)"},
      {parts:["ἵ","στη","μι"], answer:"ἵστημι", translation:"estoy de pie (presente 1sg)"},
      {parts:["δί","δο","μαι"], answer:"δίδομαι", translation:"soy dado (presente MP 1sg)"}
    ];

    let currentIndex = 0, correctCount = 0, assembled = [], totalQuestions = exercises.length, isVerified = false;

    function normalizeGreek(str) { return str.normalize('NFC').trim(); }
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }

    function loadExercise(index) {
      const ex = exercises[index];
      if (!ex) return;
      assembled = []; isVerified = false;
      const feedback = document.getElementById('feedback');
      feedback.className = 'feedback'; feedback.textContent = '';
      document.getElementById('current-q').textContent = index + 1;
      document.getElementById('total-q').textContent = totalQuestions;
      document.getElementById('translation').textContent = '💡 ' + ex.translation;
      document.getElementById('checkBtn').disabled = false;
      document.getElementById('nextBtn').disabled = true;

      const piecesContainer = document.getElementById('piecesContainer');
      piecesContainer.innerHTML = '';
      shuffle(ex.parts).forEach((part, i) => {
        const piece = document.createElement('div');
        piece.className = 'piece';
        piece.textContent = part;
        piece.dataset.part = part;
        piece.dataset.uid = 'p' + index + '_' + i;
        piece.addEventListener('click', () => handlePieceClick(piece));
        piecesContainer.appendChild(piece);
      });
      updateAssemblyArea();
    }

    function handlePieceClick(piece) {
      if (isVerified) return;
      if (piece.classList.contains('used')) return;
      piece.classList.add('used');
      assembled.push({ part: piece.dataset.part, uid: piece.dataset.uid });
      updateAssemblyArea();
    }

    function updateAssemblyArea() {
      const area = document.getElementById('assemblyArea');
      if (assembled.length === 0) { area.innerHTML = '<div class="placeholder">Toca las piezas para armar la forma verbal</div>'; return; }
      area.innerHTML = '';
      assembled.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'assembled-piece';
        div.textContent = item.part;
        div.addEventListener('click', () => removeAssembledPiece(idx));
        area.appendChild(div);
      });
    }

    function removeAssembledPiece(idx) {
      if (isVerified) return;
      const removed = assembled.splice(idx, 1)[0];
      document.querySelectorAll('#piecesContainer .piece').forEach(p => {
        if (p.dataset.uid === removed.uid) p.classList.remove('used');
      });
      updateAssemblyArea();
    }

    function checkAnswer() {
      if (isVerified) return;
      const ex = exercises[currentIndex];
      const feedback = document.getElementById('feedback');
      const userAnswer = normalizeGreek(assembled.map(a => a.part).join(''));
      const correctAnswer = normalizeGreek(ex.answer);
      if (userAnswer === correctAnswer) {
        isVerified = true;
        feedback.textContent = `✅ ¡Correcto! ${ex.answer} = ${ex.translation}`;
        feedback.className = 'feedback success show';
        correctCount++;
        document.getElementById('correct-count').textContent = correctCount;
        document.getElementById('checkBtn').disabled = true;
        document.getElementById('nextBtn').disabled = false;
      } else {
        feedback.textContent = `❌ Incorrecto. La respuesta correcta es: "${ex.answer}"`;
        feedback.className = 'feedback error show';
      }
    }

    function resetExercise() { loadExercise(currentIndex); }
    function nextExercise() {
      if (currentIndex < totalQuestions - 1) { currentIndex++; loadExercise(currentIndex); }
      else { showFinalMessage(); }
    }

    function showFinalMessage() {
      document.getElementById('overlay').classList.add('active');
      const percentage = Math.round((correctCount / totalQuestions) * 100);
      let emoji = '📚', message = 'Sigue practicando, ¡lo lograrás!';
      if (percentage >= 90) { emoji = '🌟'; message = '¡Excelente armador de formas verbales!'; }
      else if (percentage >= 70) { emoji = '👍'; message = '¡Buen trabajo! Sigue así.'; }
      else if (percentage >= 50) { emoji = '💪'; message = 'Vas por buen camino, ¡sigue practicando!'; }
      const finalHTML = `
        <div class="final-message">
          <img src="https://i.postimg.cc/wMJ2bCgV/mas-logos.jpg" alt="Logo">
          <h2>${emoji} ¡Juego Completado!</h2>
          <div class="stats">
            <p>🧩 Puzzles: <span>${totalQuestions}</span></p>
            <p>✅ Aciertos: <span>${correctCount}</span></p>
            <p>🎯 Porcentaje: <span>${percentage}%</span></p>
            <p style="margin-top: 10px;">${message}</p>
          </div>
          <button onclick="reiniciarJuego()" style="margin-top: 20px; padding: 12px 35px; border: none; border-radius: 50px; background: linear-gradient(135deg, #FFD700, #FFA500); color: #1a1a2e; font-size: 1.1rem; font-weight: 700; cursor: pointer;">🔄 Jugar de nuevo</button>
        </div>`;
      const old = document.querySelector('.final-message'); if (old) old.remove();
      document.body.insertAdjacentHTML('beforeend', finalHTML);
    }

    function reiniciarJuego() {
      document.querySelector('.final-message')?.remove();
      document.getElementById('overlay').classList.remove('active');
      currentIndex = 0; correctCount = 0;
      document.getElementById('correct-count').textContent = '0';
      loadExercise(0);
    }

    document.getElementById('checkBtn').addEventListener('click', checkAnswer);
    document.getElementById('resetBtn').addEventListener('click', resetExercise);
    document.getElementById('nextBtn').addEventListener('click', nextExercise);
    document.addEventListener('DOMContentLoaded', () => { loadExercise(0); });
  </script>
</body>
</html>
