<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz de lectura</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Georgia,serif;background:linear-gradient(160deg,#0f1b3d,#1d2f63);color:#f1f3fa;min-height:100vh}
  .w{max-width:820px;margin:auto;padding:24px 16px 60px}
  h1{font-size:1.6em;text-align:center;margin-bottom:4px}
  h1 small{display:block;font-size:.5em;color:#f5c542;font-weight:400;margin-top:6px;letter-spacing:1px}
  .c{background:rgba(255,255,255,.08);border:1px solid rgba(245,197,66,.3);border-radius:16px;padding:20px;margin:18px 0}
  .r{color:#f5c542;font-family:sans-serif;font-size:.85em;letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}
  .g{font-size:1.2em;line-height:1.6;margin:8px 0}
  button,.b{background:#f5c542;color:#16224a;border:0;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer;font-family:sans-serif;margin:4px 0;transition:.2s}
  button:hover{background:#ffe27a}
  .t{font-family:sans-serif;font-size:.85em;color:#b8c2e6;text-align:center}
  .o1{display:block;width:100%;text-align:left;margin:6px 0;background:rgba(255,255,255,.12);color:#fff;font-weight:400;border-radius:8px;padding:10px 14px}
  .o1.ok{background:#2e9e5b}
  .o1.no{background:#b3394a}
  .n{max-height:0;overflow:hidden;transition:max-height .5s,padding .3s;font-family:sans-serif;line-height:1.55;background:rgba(245,197,66,.12);border-radius:10px;padding:0 14px}
  .n.o{max-height:500px;padding:12px 14px}
  .nav-links{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:20px}
  .nav-links a{background:#f5c542;color:#16224a;padding:10px 18px;border-radius:10px;font-weight:700;text-decoration:none;font-family:sans-serif;transition:.2s}
  .nav-links a:hover{background:#ffe27a}
</style>
</head>
<body>
<div class="w">
  <h1>Quiz de lectura<small>1 Juan 1:1-10 · Semana 30</small></h1>

  <div class="c">
    <div id="q"></div>
    <p id="s" class="t"></p>
  </div>

  <div class="nav-links">
    <a href="2. Dios es luz.html">◀ Anterior: Dios es luz</a>
    <a href="3. Video de la semana.html">Volver al inicio ▶</a>
  </div>

  <p class="t" style="margin-top:24px">Ministerio «Vivos para Servir» · Curso de Griego Koiné · Semana 30</p>
</div>

<script>
const Q = [
  {q:"¿Qué efecto tiene el uso de cuatro verbos sensoriales en 1:1?", o:["Afirma la experiencia física real del Verbo de vida","Es un recurso poético sin valor doctrinal","Solo describe emociones"], a:0, e:"Frente a quienes negaban la humanidad de Cristo, el apóstol afirma lo oído, visto, contemplado y palpado."},
  {q:"¿Qué tiempo tienen ἀκηκόαμεν y ἑωράκαμεν?", o:["Perfecto","Aoristo","Presente"], a:0, e:"Perfecto: lo oído y visto permanece como testimonio presente."},
  {q:"¿Qué significa ψηλαφάω?", o:["Palpar, tocar con las manos","Oír con atención","Escribir"], a:0, e:"Recuerda Lucas 24:39: la realidad física de la encarnación."},
  {q:"¿Qué significa κοινωνία?", o:["Comunión, participación compartida","Condena","Tiniebla"], a:0, e:"De κοινός, «común»: compartir en común."},
  {q:"¿Qué propósito tiene el anuncio apostólico en 1:3?", o:["Que los lectores tengan comunión con los apóstoles y con el Padre y el Hijo","Que aumente el número de discípulos","Que se recuerde la ley"], a:0, e:"ἵνα καὶ ὑμεῖς κοινωνίαν ἔχητε μεθ’ ἡμῶν."},
  {q:"¿Qué significa que φῶς sea predicado cualitativo en 1:5?", o:["Dios es luz por naturaleza, no una luz entre otras","Dios es una luz creada","Dios refleja la luz"], a:0, e:"Como «Dios es espíritu» (Jn 4:24) y «Dios es amor» (1 Jn 4:8)."},
  {q:"¿Qué efecto tiene οὐκ … οὐδεμία en 1:5?", o:["Doble negación enfática: ninguna tiniebla en Dios","Duda","Pregunta retórica"], a:0, e:"No hay en él ninguna sombra de tiniebla."},
  {q:"¿Qué estructura tienen los vv. 6-10?", o:["Cinco condicionales de tercera clase (ἐὰν + subjuntivo)","Cinco imperativos","Cinco participios"], a:0, e:"Hipótesis que pueden darse en la comunidad, sin afirmar que ocurran."},
  {q:"¿Qué significa περιπατέω?", o:["Andar; estilo de vida","Correr","Saltar"], a:0, e:"En Juan designa el estilo de vida."},
  {q:"¿Qué diferencia hay entre el v. 8 y el v. 10?", o:["El v. 8 niega la condición de pecado; el v. 10 niega los actos pecaminosos","El v. 8 habla de actos; el v. 10 de condición","No hay diferencia"], a:0, e:"ἔχομεν (v. 8) vs. ἡμαρτήκαμεν (v. 10)."},
  {q:"¿Qué significa ὁμολογέω?", o:["Confesar; «decir lo mismo» que Dios","Negar","Ocultar"], a:0, e:"ὁμο- (mismo) + λέγω (decir)."},
  {q:"¿Por qué Dios es πιστός y δίκαιος al perdonar?", o:["Porque el perdón se funda en la expiación y no contradice su justicia","Porque ignora el pecado","Porque es indulgente sin más"], a:0, e:"Cf. 2:1-2: la expiación de Jesucristo el justo."},
  {q:"¿Qué consecuencia tiene decir «no hemos pecado» (v. 10)?", o:["Hacemos mentiroso a Dios y su palabra no está en nosotros","Recibimos perdón inmediato","Se fortalece la comunión"], a:0, e:"ψεύστην ποιοῦμεν αὐτόν."},
  {q:"¿Qué significa que el Verbo se hizo carne según 1:1-10?", o:["Que el Hijo asumió la humanidad real y fue testificado por los sentidos","Que solo parecía humano","Que fue creado"], a:0, e:"El apóstol afirma una experiencia física frente a los que negaban la encarnación."}
];

let i=0, p=0;
function r(){
  const q = Q[i];
  const cont = document.getElementById("q");
  const s = document.getElementById("s");
  if(!q){
    cont.innerHTML = `<h2 style="text-align:center;color:#f5c542">🏆 ${p} / ${Q.length}</h2><div style="text-align:center"><button onclick="i=0;p=0;r()">Repetir</button></div>`;
    s.textContent = "";
    return;
  }
  s.textContent = "Pregunta " + (i+1) + " de " + Q.length;
  cont.innerHTML = "<p class='g'>" + q.q + "</p>" +
    q.o.map((x,k)=>`<button class='o1' onclick='a(${k},this)'>${x}</button>`).join("") +
    "<div class='n' id='e'></div>";
}
function a(k,b){
  const q = Q[i];
  if(document.querySelector(".ok")) return;
  if(k == q.a){ p++; b.classList.add("ok"); }
  else { b.classList.add("no"); document.querySelectorAll(".o1")[q.a].classList.add("ok"); }
  const e = document.getElementById("e");
  e.textContent = q.e;
  e.classList.add("o");
  e.insertAdjacentHTML("afterend","<button onclick='i++;r()'>Siguiente ▶</button>");
}
r();
</script>
</body>
</html>
